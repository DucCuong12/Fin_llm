<svg xmlns="http://www.w3.org/2000/svg" width="830" height="338"
     viewBox="0 0 830 338" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">VolTilt daily portfolio construction</title>
<desc id="figure-description">Above, a language model scores company news. The current ranks
divide invested capital among assets A, B, and C. In Section 4.3, illustrated by two
past close-to-close sessions, prior tilts weight the following asset returns. The volatility
of twenty unscaled portfolio returns sets the invested fraction. In the illustrative
next-session portfolio, 60 percent is invested in A, B, and C and the rest is cash.</desc>
