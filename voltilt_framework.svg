  </pattern>
  <marker id="arrow-slate" markerUnits="userSpaceOnUse" viewBox="0 0 11 10" refX="9" refY="5" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0L10 5 0 10 2.6 5Z" fill="#68798B"/></marker>
  <marker id="arrow-teal" markerUnits="userSpaceOnUse" viewBox="0 0 11 10" refX="9" refY="5" markerWidth="11" markerHeight="10" orient="auto"><path d="M0 0L10 5 0 10 2.6 5Z" fill="#207D73"/></marker>
  <marker id="arrow-amber" markerUnits="userSpaceOnUse" viewBox="0 0 11 10" refX="9" refY="5" markerWidth="11" markerHeight="10" orient="auto"><path d="M0 0L10 5 0 10 2.6 5Z" fill="#AC6818"/></marker>
